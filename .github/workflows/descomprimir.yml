name: Descomprimir proyecto iOS

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Descomprimir ZIP
        run: |
          unzip -o Control_horario_App_iOS_fuentes.zip -d .

      - name: Guardar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ControlHorarioNativo
          git commit -m "Añadir archivos del proyecto iOS" || exit 0
          git push
